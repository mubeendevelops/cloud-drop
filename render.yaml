# Render blueprint for the Cloud Drop API.
# Secret values are never stored here: every `sync: false` variable is set in
# the Render dashboard.
services:
  - type: web
    name: cloud-drop
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated list of allowed frontend origins
      - key: CLIENT_URLS
        sync: false
